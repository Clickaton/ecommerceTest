<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css">
    <link rel="stylesheet" type="text/css" href="/css/styleCartas.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css"
        integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/" crossorigin="anonymous" />
    <link rel="stylesheet" type="text/css" href="/css/nav.css">
</head>

<body>
    <header>
        <nav th:replace="fragments/navbar :: nav"></nav>
    </header>

    <div th:replace="fragments/error :: mensajeError"></div>

    <div class="title">
        <h3 class="display-6 fw-bold">Pago de Carrito</h3>
    </div>

    <div class="content-form">
        <form class="form" th:action="@{/cart/pay}" method="post" enctype="multipart/form-data">
            <h4 th:text="'Total a pagar: $' + ${totalAmount}"></h4>
            <div class="mb-3">
                <label for="cardNumber" class="form-label">Número de Tarjeta</label>
                <input type="text" class="form-control" id="cardNumber" name="cardNumber" required>
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Dirección de Envío</label>
                <input type="text" class="form-control" id="address" name="address" required>
            </div>

            <div class="title">
                <button type="submit" class="btn btn-primary boton2 mb-4 w-100 fs-5 botonCartas" style="background-color: #f7a46f !important;">Pagar <i class="fas fa-check"></i></button> &nbsp;&nbsp;
                <a th:href="@{/cart/myCart/__${session.usuariosession.id}__}" class="btn btn-primary boton2 mb-4 w-100 fs-5 botonCartas">Volver</a>
            </div>
        </form>
    </div>
    <br><br><br><br>

    <footer class="py-5">
        <div class="d-flex flex-column flex-sm-row justify-content-between py-4 my-4 border-top">
            <p>&copy; 2023 Clorotuc, Inc. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous">
    </script>
    <script src="https://kit.fontawesome.com/9925dbe6e4.js" crossorigin="anonymous"></script>
</body>
</html>
