<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="container mt-5">
    <h2>Edit User</h2>
    <form th:action="@{/admin/user/update/__${user.id}__}" method="post">
        <div class="mb-3">
            <label>Name</label>
            <input type="text" class="form-control" name="name" th:value="${user.name}" />
        </div>
        <div class="mb-3">
            <label>Last Name</label>
            <input type="text" class="form-control" name="lastName" th:value="${user.lastName}" />
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input type="email" class="form-control" name="email" th:value="${user.email}" />
        </div>
        <div class="mb-3">
            <label>Phone</label>
            <input type="text" class="form-control" name="phone" th:value="${user.phone}" />
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="/admin/users" class="btn btn-secondary">Cancel</a>
    </form>
</body>
</html>
