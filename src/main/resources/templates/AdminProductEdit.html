<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="container mt-5">
    <h2>Edit Product</h2>
    <form th:action="@{/admin/product/update/__${product.id}__}" method="post">
        <div class="mb-3">
            <label>Name</label>
            <input type="text" class="form-control" name="name" th:value="${product.name}" />
        </div>
        <div class="mb-3">
            <label>Description</label>
            <input type="text" class="form-control" name="description" th:value="${product.description}" />
        </div>
        <div class="mb-3">
            <label>Price</label>
            <input type="number" step="0.01" class="form-control" name="price" th:value="${product.price}" />
        </div>
        <div class="mb-3">
            <label>Stock</label>
            <input type="number" class="form-control" name="stock" th:value="${product.stock}" />
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="/admin/products" class="btn btn-secondary">Cancel</a>
    </form>
</body>
</html>
